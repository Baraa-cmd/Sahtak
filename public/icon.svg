  <g filter="url(#shadow)" transform="translate(0, -4)">
    <!-- Medical Cross -->
    <path d="M 220 120 C 220 111.16 227.16 104 236 104 L 276 104 C 284.84 104 292 111.16 292 120 L 292 212 L 384 212 C 392.84 212 400 219.16 400 228 L 400 268 C 400 276.84 392.84 284 384 284 L 292 284 L 292 376 C 292 384.84 284.84 392 276 392 L 236 392 C 227.16 392 220 384.84 220 376 L 220 284 L 128 284 C 119.16 284 112 276.84 112 268 L 112 228 C 112 219.16 119.16 212 128 212 L 220 212 Z" fill="#ffffff" />
    
    <!-- Heartbeat / Pulse Wave -->
    <path d="M 120 248 L 195 248 L 225 185 L 255 315 L 285 220 L 315 270 L 335 248 L 392 248" fill="none" stroke="#059669" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Crescent Emblem -->
  <circle cx="256" cy="425" r="14" fill="#a7f3d0" />
</svg>
